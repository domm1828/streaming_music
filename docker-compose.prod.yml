# Despliegue de producción: en Docker va SOLO SeaweedFS (object store S3 de los medios).
# Todo lo demás corre en el host del VPS, fuera de Docker:
#   - MongoDB (la API lo usa por 127.0.0.1:27017).
#   - API NestJS con PM2 (ver ecosystem.config.cjs; lee el .env de la raíz del repo).
#   - nginx: termina TLS, sirve el SPA (apps/web/dist) y hace de reverse proxy
#     (/api → 127.0.0.1:3000, /s3 → 127.0.0.1:8333). Ver docker/nginx/.
#
# Uso:
#   # (opcional) secret de SeaweedFS en docker/seaweedfs/s3.json
#   docker compose -f docker-compose.prod.yml up -d seaweedfs
name: stream-music-prod

services:
  seaweedfs:
    image: chrislusf/seaweedfs:3.80
    container_name: stream-music-seaweedfs
    restart: unless-stopped
    command: 'server -s3 -s3.config=/etc/seaweedfs/s3.json -dir=/data'
    volumes:
      - seaweedfs-data:/data
      - ./docker/seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro
    # Publicado en loopback: lo consumen la API y el nginx del host, no Internet.
    ports:
      - '127.0.0.1:8333:8333'

volumes:
  seaweedfs-data:
