services:
  mongo:
    image: mongo:7
    container_name: stream-music-mongo
    restart: unless-stopped
    ports:
      - '27017:27017'
    volumes:
      - mongo-data:/data/db

  redis:
    image: redis:7-alpine
    container_name: stream-music-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data

  meilisearch:
    image: getmeili/meilisearch:v1.11
    container_name: stream-music-meili
    restart: unless-stopped
    environment:
      MEILI_ENV: development
    ports:
      - '7700:7700'
    volumes:
      - meili-data:/meili_data

  mailhog:
    image: mailhog/mailhog:latest
    container_name: stream-music-mailhog
    restart: unless-stopped
    ports:
      - '1025:1025' # SMTP
      - '8025:8025' # Web UI

  # Almacenamiento de objetos S3-compatible para medios (imágenes, audio, video).
  seaweedfs:
    image: chrislusf/seaweedfs:3.80
    container_name: stream-music-seaweedfs
    restart: unless-stopped
    command: 'server -s3 -s3.config=/etc/seaweedfs/s3.json -dir=/data'
    ports:
      - '8333:8333' # API S3
      - '8888:8888' # Filer (opcional)
    volumes:
      - seaweedfs-data:/data
      - ./docker/seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro

volumes:
  mongo-data:
  redis-data:
  meili-data:
  seaweedfs-data:
